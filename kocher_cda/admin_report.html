<script>
    function jsonToCsv(items) {
        // from Tari Ibaba
        // https://tariibaba.medium.com/javascript-convert-json-to-csv-312e7503ce5d
        const header = Object.keys(items[0]);
        const headerString = header.join(',');
        const replacer = (key, value) => value ?? '';
        const rowItems = items.map((row) =>
        header
            .map((fieldName) => JSON.stringify(row[fieldName], replacer))
            .join(',')
        );
        return [headerString, ...rowItems].join('\r\n');
    }
    
    function exportToCsv(filename, obj) {
        const csv = jsonToCsv(obj);
        let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        let link = document.createElement("a");
        let url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", filename);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    function exportOrders() {
        let rows = {{ orders }};
        exportToCsv("orders.csv", rows);
    }
    
</script>

<a id="export" onclick="exportOrders()" class="btn btn-primary">Export Orders to CSV</a>
